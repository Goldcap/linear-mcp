[project]
name = "linear-mcp"
version = "0.1.0"
description = "Simple Linear MCP server for reading and updating issues"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0,<3.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# OS keyring resolution for API keys. Optional: environment variables and
# _CMD helper commands work without it.
keyring = [
    "keyring>=24.0.0",
]

[project.scripts]
linear-mcp = "linear_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
